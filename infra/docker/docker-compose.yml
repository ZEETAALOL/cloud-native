version: '3.8'

services:
  
  # Microservicio Audit
  audit:
    build:
      context: ../../backend/audit
      dockerfile: Dockerfile
    image: pedidos360/audit:latest
    container_name: pedidos360-audit
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Microservicio Catalog
  catalog:
    build:
      context: ../../backend/catalog
      dockerfile: Dockerfile
    image: pedidos360/catalog:latest
    container_name: pedidos360-catalog
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Microservicio Notify
  notify:
    build:
      context: ../../backend/notify
      dockerfile: Dockerfile
    image: pedidos360/notify:latest
    container_name: pedidos360-notify
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Microservicio Report
  report:
    build:
      context: ../../backend/report
      dockerfile: Dockerfile
    image: pedidos360/report:latest
    container_name: pedidos360-report
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Microservicio Orders
  orders:
    build:
      context: ../../backend/orders
      dockerfile: Dockerfile
    image: pedidos360/orders:latest
    container_name: pedidos360-orders
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/clientes"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Backend for Frontend (BFF)
  bff:
    build:
      context: ../../backend/bff
      dockerfile: Dockerfile
    image: pedidos360/bff:latest
    container_name: pedidos360-bff
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI:-https://login.microsoftonline.com/47c2bee0-5950-430f-9276-bfc083e3d1da/v2.0}
      - ENTRA_API_CLIENT_ID=${ENTRA_API_CLIENT_ID:-faba8741-ba0d-440c-b061-f1aa893eb957}
      - MICROSERVICES_CLIENTES_BASE_URL=http://orders:8081
      - MICROSERVICES_AUDIT_BASE_URL=http://audit:8083
      - MICROSERVICES_CATALOG_BASE_URL=http://catalog:8084
      - MICROSERVICES_REPORT_BASE_URL=http://report:8085
      - MICROSERVICES_NOTIFY_BASE_URL=http://notify:8086
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123
    depends_on:
      audit:
        condition: service_healthy
      catalog:
        condition: service_healthy
      report:
        condition: service_healthy
      notify:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  pedidos360-network:
    driver: bridge
    name: pedidos360-network
