version: '3.8'

services:
  # ==========================================
  # BASES DE DATOS
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: pedidos360-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: pedidos360
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pedidos360"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mongodb:
    image: mongo:7-jammy
    container_name: pedidos360-mongodb
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: pedidos360
    volumes:
      - mongo_data:/data/db
      - ./init-scripts/init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================
  # MICROSERVICIOS
  # ==========================================

  orders:
    build:
      context: ../../backend/orders
      dockerfile: Dockerfile
    image: pedidos360/orders:latest
    container_name: pedidos360-orders
    hostname: orders
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pedidos360
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
      - KAFKA_BOOTSTRAP_SERVERS=ec2-kafka-ip:9092
      - RABBITMQ_HOST=ec2-mq-ip
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  catalog:
    build:
      context: ../../backend/catalog
      dockerfile: Dockerfile
    image: pedidos360/catalog:latest
    container_name: pedidos360-catalog
    hostname: catalog
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pedidos360
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  audit:
    build:
      context: ../../backend/audit
      dockerfile: Dockerfile
    image: pedidos360/audit:latest
    container_name: pedidos360-audit
    hostname: audit
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATA_MONGODB_URI=mongodb://admin:admin123@mongodb:27017/pedidos360?authSource=admin
      - KAFKA_BOOTSTRAP_SERVERS=ec2-kafka-ip:9092
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  report:
    build:
      context: ../../backend/report
      dockerfile: Dockerfile
    image: pedidos360/report:latest
    container_name: pedidos360-report
    hostname: report
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pedidos360
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
      - KAFKA_BOOTSTRAP_SERVERS=ec2-kafka-ip:9092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  notify:
    build:
      context: ../../backend/notify
      dockerfile: Dockerfile
    image: pedidos360/notify:latest
    container_name: pedidos360-notify
    hostname: notify
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx256m -Xms128m
      - RABBITMQ_HOST=ec2-mq-ip
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  bff:
    build:
      context: ../../backend/bff
      dockerfile: Dockerfile
    image: pedidos360/bff:latest
    container_name: pedidos360-bff
    hostname: bff
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
      - ENTRA_ISSUER_URI=https://login.microsoftonline.com/47c2bee0-5950-430f-9276-bfc083e3d1da/v2.0
      - ENTRA_API_CLIENT_ID=faba8741-ba0d-440c-b061-f1aa893eb957
      - MICROSERVICES_ORDERS_BASE_URL=http://orders:8081
      - MICROSERVICES_CATALOG_BASE_URL=http://catalog:8084
      - MICROSERVICES_AUDIT_BASE_URL=http://audit:8083
      - MICROSERVICES_REPORT_BASE_URL=http://report:8085
      - MICROSERVICES_NOTIFY_BASE_URL=http://notify:8086
      - RABBITMQ_HOST=ec2-mq-ip
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      orders:
        condition: service_healthy
      catalog:
        condition: service_healthy
      audit:
        condition: service_healthy
      report:
        condition: service_healthy
      notify:
        condition: service_healthy
    networks:
      - pedidos360-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres_data:
    name: pedidos360-postgres-data
  mongo_data:
    name: pedidos360-mongo-data

networks:
  pedidos360-network:
    driver: bridge
    name: pedidos360-network
