server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

logging:
  level:
    cl.duoc.orders: INFO
    org.springframework: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
